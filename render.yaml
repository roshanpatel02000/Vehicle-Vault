services:
  - type: web
    name: vehicle-vault
    env: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn --chdir vehicle_vault vehicle_vault.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-vault-db
          property: connectionString

databases:
  - name: vehicle-vault-db
    databaseName: vehicle_vault
    user: vehicle_vault_user
